# Rockchip RK3288 "veyron" Chromebooks (Asus C201P and relatives).
#
# The module list is the one derived on a booted C201P; it is what the kernel
# needs to power the SD slot and reach the ext4 root. Do not trim it by
# guessing: a hand-picked shorter list left the kernel unable to mount root,
# and it panicked before any console existed to say so.
#
# autodetect is deliberately not in HOOKS. The image is built in a foreign
# qemu-user chroot on an x86 host, where autodetect traces the build machine's
# devices instead of the Chromebook's and drops the modules above out of the
# initramfs it produces.

MODULES=(i2c_rk3x rk808_regulator rockchip_io_domain pwm_rockchip
         dw_mmc dw_mmc_pltfm dw_mmc_rockchip ext4
         spi_rockchip cros_ec cros_ec_spi cros_ec_keyb
         rockchipdrm analogix_dp panel_edp phy_rockchip_dp pwm_bl
         phy_rockchip_usb dwc2)

HOOKS=(base udev modconf kms block filesystems fsck)
